 <body>
    <script>
        function checkCode() {
            let userCode = prompt("Enter the code:")

            let correctCode = "Secret123"

            if (userCode !== null) {
                if (userCode.trim() === correctCode) {
                    window.location.href = "./games.html"

                    alert("error 403: access denied!!!")
                }
            }
        }
    </script>
    <div class="header-container">

    <img class="header-image" src="math.gif" alt="math symbols illustration">
    </div>

    <button onclick="checkCode()">Math Games Here!</button>
 </body>
