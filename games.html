        .button:active {

    <script>
        function filterGames() {
            // Get what the user typed and change it to lowercase
            let input = document.getElementById('searchBar').value.toLowerCase();
            
            // Get all the buttons inside the grid
            let grid = document.getElementById('gamesGrid');
            let buttons = grid.getElementsByClassName('button');

            // Loop through every single button
            for (let i = 0; i < buttons.length; i++) {
                let buttonText = buttons[i].textContent || buttons[i].innerText;
                
                // If the text matches the search input, show it. Otherwise, hide it.
                if (buttonText.toLowerCase().includes(input)) {
                    buttons[i].style.display = "";
                } else {
                    buttons[i].style.display = "none";
                }
            }
        }
    </script>
